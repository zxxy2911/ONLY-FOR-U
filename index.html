<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Beloved - SYTTY SALSABILA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050005;
            font-family: 'Georgia', serif;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #2e0a1a 0%, #050005 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            transition: opacity 1.5s ease;
        }

        #start-button {
            padding: 18px 50px;
            background: rgba(255, 105, 180, 0.1);
            border: 1px solid #ff69b4;
            color: #ff69b4;
            font-size: 1rem;
            letter-spacing: 5px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.5s;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
            text-transform: uppercase;
        }

        #start-button:hover {
            background: #ff69b4;
            color: white;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.6);
        }

        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 182, 193, 0.4);
            font-size: 0.75rem;
            pointer-events: none;
            text-align: center;
            z-index: 10;
            letter-spacing: 1px;
        }

        #music-ui {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 192, 203, 0.1);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 192, 203, 0.2);
            color: #ffb6c1;
            font-size: 10px;
            opacity: 0;
            transition: opacity 2s;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div style="margin-bottom: 40px; text-align: center;">
            <h1 style="font-weight: 100; letter-spacing: 8px; margin-bottom: 10px; color: #ffb6c1;">ONLY FOR BIA🌷</h1>
            <p style="color: #8b4a5d; font-size: 0.8rem; letter-spacing: 3px;">A Galaxy Made of Love</p>
        </div>
        <button id="start-button">BUKA BUAT LIAT ISI HATINYA😖💗</button>
    </div>

    <!-- Link musik instrumental romantis -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <div id="music-ui">
        <span>🌹 ROMANTIC ORBIT</span>
    </div>

    <div class="hint">I LOVEE YOUU CINTAKUU💞🌷</div>

    <script>
        let scene, camera, renderer, starPoints, core, photoGroup, textSprite, atmosphere, petals;
        let targetX = 0, targetY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let lastInteractTime = 0;
        
        const bgMusic = document.getElementById('bgMusic');
        const startBtn = document.getElementById('start-button');
        const overlay = document.getElementById('start-overlay');
        const musicUi = document.getElementById('music-ui');

        const romanticQuotes = [
            "Hanya Untukmu, SAYANGKUUU",
            "cinta eja seluas galaksi ini",
            "semestaku",
            "selamanya dalam dekapan bintang",
            "indahnya Parasmu di mataku"
        ];
        let currentQuoteIndex = 0;

        startBtn.onclick = () => {
            bgMusic.play();
            overlay.style.opacity = '0';
            musicUi.style.opacity = '1';
            setTimeout(() => {
                overlay.style.display = 'none';
                lastInteractTime = Date.now();
                updateQuote();
            }, 1500);
        };

        function updateQuote() {
            setInterval(() => {
                currentQuoteIndex = (currentQuoteIndex + 1) % romanticQuotes.length;
                const newSprite = createTextSprite(romanticQuotes[currentQuoteIndex]);
                scene.remove(textSprite);
                textSprite = newSprite;
                textSprite.position.set(0, 40, 0);
                scene.add(textSprite);
            }, 6000);
        }

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 256;
            ctx.shadowColor = "rgba(255, 105, 180, 0.9)";
            ctx.shadowBlur = 20;
            ctx.fillStyle = "white";
            ctx.font = "italic bold 45px 'Georgia'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.scale.set(90, 22.5, 1);
            return sprite;
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 200;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 1. Romantic Planet (Warna Pink/Rose Gold)
            const coreGeom = new THREE.SphereGeometry(20, 64, 64);
            const coreMat = new THREE.MeshPhongMaterial({ 
                color: 0xff69b4, 
                emissive: 0x441122,
                specular: 0xffffff,
                shininess: 20
            });
            core = new THREE.Mesh(coreGeom, coreMat);
            scene.add(core);

            // 2. Glowing Aura
            const atmosGeom = new THREE.SphereGeometry(22, 64, 64);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0xffb6c1,
                transparent: true,
                opacity: 0.2,
                side: THREE.BackSide
            });
            atmosphere = new THREE.Mesh(atmosGeom, atmosMat);
            scene.add(atmosphere);

            // 3. Lighting
            const sunLight = new THREE.PointLight(0xffffff, 1.5, 500);
            sunLight.position.set(100, 100, 100);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0xffe4e1, 0.4));

            // 4. Initial Text
            textSprite = createTextSprite(romanticQuotes[0]);
            textSprite.position.set(0, 40, 0);
            scene.add(textSprite);

            // 5. Twinkling Stars
            const starGeom = new THREE.BufferGeometry();
            const starCount = 8000;
            const starPositions = new Float32Array(starCount * 3);
            for(let i = 0; i < starCount * 3; i++) {
                starPositions[i] = (Math.random() - 0.5) * 1500;
            }
            starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            starPoints = new THREE.Points(starGeom, new THREE.PointsMaterial({ size: 1.5, color: 0xfff0f5, transparent: true, opacity: 0.6 }));
            scene.add(starPoints);

            // 6. Falling Rose Petals
            const petalGeom = new THREE.BufferGeometry();
            const petalCount = 300;
            const petalPos = new Float32Array(petalCount * 3);
            for(let i = 0; i < petalCount * 3; i++) {
                petalPos[i] = (Math.random() - 0.5) * 600;
            }
            petalGeom.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));
            petals = new THREE.Points(petalGeom, new THREE.PointsMaterial({ size: 3, color: 0xff69b4, transparent: true, opacity: 0.7 }));
            scene.add(petals);

            // 7. Photo Gallery
            photoGroup = new THREE.Group();
            scene.add(photoGroup);

            const myPhotos = ['123939.jpg', '123940.jpg', '123941.jpg'];
            const textureLoader = new THREE.TextureLoader();

            for(let i = 0; i < 36; i++) {
                const photoUrl = myPhotos[i % myPhotos.length];
                const texture = textureLoader.load(photoUrl);
                
                const photoContainer = new THREE.Group();
                // Foto melingkar tipis
                const photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
                // Bingkai Rose Gold
                const borderMesh = new THREE.Mesh(new THREE.PlaneGeometry(19.5, 19.5), new THREE.MeshBasicMaterial({ color: 0xffb6c1, side: THREE.DoubleSide }));
                borderMesh.position.z = -0.1;

                photoContainer.add(photoMesh);
                photoContainer.add(borderMesh);
                
                const angle = Math.random() * Math.PI * 2;
                const radius = 80 + Math.random() * 120;
                const yDist = (Math.random() - 0.5) * 140;
                
                photoContainer.position.set(Math.cos(angle) * radius, yDist, Math.sin(angle) * radius);
                photoContainer.userData = { angle: angle, radius: radius, speed: 0.0008 + Math.random() * 0.0015, yPhase: Math.random() * 20 };
                photoGroup.add(photoContainer);
            }

            // Interactive Controls
            const onIn = (x, y) => { isDragging = true; previousMousePosition = { x, y }; lastInteractTime = Date.now(); };
            document.addEventListener('mousedown', (e) => onIn(e.clientX, e.clientY));
            document.addEventListener('touchstart', (e) => onIn(e.touches[0].clientX, e.touches[0].clientY));
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('touchend', () => isDragging = false);
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    targetX += (e.clientX - previousMousePosition.x) * 0.003;
                    targetY += (e.clientY - previousMousePosition.y) * 0.003;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                    lastInteractTime = Date.now();
                }
            });
            document.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    const t = e.touches[0];
                    targetX += (t.clientX - previousMousePosition.x) * 0.003;
                    targetY += (t.clientY - previousMousePosition.y) * 0.003;
                    previousMousePosition = { x: t.clientX, y: t.clientY };
                    lastInteractTime = Date.now();
                }
            });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0008;

            // Rose Petals Falling
            const pPos = petals.geometry.attributes.position.array;
            for (let i = 0; i < 300; i++) {
                pPos[i * 3 + 1] -= 0.5; // Jatuh pelan
                pPos[i * 3] += Math.sin(time + i) * 0.2; // Bergoyang tertiup angin
                if (pPos[i * 3 + 1] < -300) pPos[i * 3 + 1] = 300;
            }
            petals.geometry.attributes.position.needsUpdate = true;

            // Planet Rotation & Pulse
            core.rotation.y += 0.003;
            atmosphere.scale.setScalar(1.05 + Math.sin(time * 2) * 0.03);

            // Romantic Auto Orbit
            if (!isDragging && (Date.now() - lastInteractTime > 1000)) {
                targetX += 0.0015; // Putaran sangat lambat dan romantis
                targetY = Math.sin(time * 0.4) * 0.15;
            }

            scene.rotation.y += (targetX - scene.rotation.y) * 0.03;
            scene.rotation.x += (targetY - scene.rotation.x) * 0.03;

            // Photos Swaying
            photoGroup.children.forEach(p => {
                p.userData.angle += p.userData.speed;
                p.position.x = Math.cos(p.userData.angle) * p.userData.radius;
                p.position.z = Math.sin(p.userData.angle) * p.userData.radius;
                p.position.y += Math.sin(time + p.userData.yPhase) * 0.02;
                p.lookAt(camera.position);
            });

            if(textSprite) textSprite.position.y = 42 + Math.sin(time * 2) * 2;
            
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
